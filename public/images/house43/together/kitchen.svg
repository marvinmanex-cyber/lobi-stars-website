<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- Behind the scenes: the kitchen, a pan on the fire, a chef's hat and steam (illustration; replace with a photo later). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F2937"/><stop offset="1" stop-color="#0B0F16"/></linearGradient>
    <radialGradient id="fire" cx=".5" cy="1" r=".9"><stop offset="0" stop-color="#FFF3C4"/><stop offset=".35" stop-color="#F2B705"/><stop offset=".7" stop-color="#F97316"/><stop offset="1" stop-color="#E31E24"/></radialGradient>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F97316" stop-opacity=".45"/><stop offset="1" stop-color="#F97316" stop-opacity="0"/></radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D1D5DB"/><stop offset="1" stop-color="#6B7280"/></linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <!-- wall tiles -->
  <g stroke="#fff" stroke-opacity=".06" stroke-width="2" fill="none">
    <path d="M0 40h400M0 80h400M0 120h400M0 160h400M0 200h400M0 240h400M0 280h400"/>
    <path d="M40 0v300M80 0v300M120 0v300M160 0v300M200 0v300M240 0v300M280 0v300M320 0v300M360 0v300"/>
  </g>
  <!-- hanging utensils -->
  <path d="M40 30h320" stroke="#C9B488" stroke-width="4" stroke-linecap="round"/>
  <g fill="url(#steel)">
    <path d="M80 30v60"/><rect x="77" y="30" width="6" height="60" rx="3"/><ellipse cx="80" cy="100" rx="16" ry="20"/>
    <rect x="137" y="30" width="6" height="80" rx="3"/><path d="M128 110h24l-4 30h-16z"/>
    <rect x="257" y="30" width="6" height="66" rx="3"/><circle cx="260" cy="110" r="18"/><circle cx="260" cy="110" r="10" fill="#1F2937"/>
    <rect x="317" y="30" width="6" height="56" rx="3"/><path d="M308 86h24v40c0 8-24 8-24 0z"/>
  </g>
  <!-- chef hat -->
  <g transform="translate(200 120)">
    <path d="M-40 10c-20 0-24-30-4-34 0-20 26-26 36-12 8-16 34-14 38 4 20-2 26 28 6 34v30h-76z" fill="#fff"/>
    <rect x="-38" y="32" width="76" height="16" rx="3" fill="#E8D9B5"/>
    <text x="0" y="45" text-anchor="middle" font-family="Bebas Neue, Impact, sans-serif" font-size="14" fill="#B3151A">HOUSE 43</text>
  </g>
  <!-- counter -->
  <path d="M0 330h400v170H0z" fill="#111827"/><path d="M0 330h400" stroke="url(#steel)" stroke-width="10"/>
  <circle cx="200" cy="330" r="150" fill="url(#warm)"/>
  <!-- flames -->
  <path d="M120 330c-6-30 14-40 10-70 18 16 18 36 30 30 0-20 8-40 26-50-4 30 20 36 14 60 10-6 14-20 12-34 22 20 30 50 18 64z" fill="url(#fire)"/>
  <!-- pan -->
  <path d="M100 320h200c0 26-30 40-100 40s-100-14-100-40z" fill="#374151"/><path d="M296 326l90-14" stroke="#374151" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="200" cy="320" rx="100" ry="10" fill="#4B5563"/>
  <ellipse cx="180" cy="318" rx="20" ry="5" fill="#E8742A"/><ellipse cx="220" cy="317" rx="14" ry="4" fill="#2FA36B"/><circle cx="200" cy="314" r="5" fill="#B3151A"/>
  <!-- steam -->
  <g fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="4" stroke-linecap="round">
    <path d="M170 250c-10-14 10-22 0-38"/><path d="M200 240c-10-14 10-22 0-38"/><path d="M230 250c-10-14 10-22 0-38"/>
  </g>
  <!-- sparks -->
  <g fill="#F2B705"><circle cx="150" cy="230" r="2.5"/><circle cx="250" cy="220" r="2"/><circle cx="270" cy="250" r="2.5"/><circle cx="135" cy="260" r="2"/></g>
</svg>
