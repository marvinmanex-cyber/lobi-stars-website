backend:
  name: github
  repo: marvinmanex-cyber/lobi-stars-website
  branch: main
  # Restrict to the personal access token login flow. Without this, Sveltia
  # also shows a "Sign in with GitHub" OAuth button that falls back to
  # api.netlify.com (a legacy default) and 404s, since this site isn't on
  # Netlify and has no OAuth worker configured.
  auth_methods: ["token"]

# Puts a clickable link back to the live site in the CMS header, and uses
# the club badge as the CMS logo.
site_url: "https://lobistarsfc.com"
display_url: "https://lobistarsfc.com"
logo_url: "https://lobistarsfc.com/images/hero-6.jpg"

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "news"
    label: "News Articles"
    folder: "src/content/news"
    create: true
    # The file name becomes the article URL: /news/<file-name>
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["publishedAt", "title", "category"]
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Summary (1-2 sentences, shown on cards and banners)", name: "summary", widget: "text"}
      - {label: "Category", name: "category", widget: "select", options: ["First Team", "Team News", "Club", "Features", "Tickets", "Media Watch"], default: "First Team", hint: "Features = long reads (wide layout with reading time). Club = community, partners and off-pitch stories."}
      - {label: "Cover Image (16:9 works best)", name: "coverImage", widget: "image"}
      - {label: "Cover Image Description (for screen readers)", name: "imageAlt", widget: "string"}
      - {label: "Published At", name: "publishedAt", widget: "datetime"}
      - {label: "Is this a video?", name: "isVideo", widget: "boolean", default: false}
      - {label: "Video Link (YouTube, Vimeo or .mp4)", name: "videoUrl", widget: "string", required: false}
      - {label: "Video Duration (e.g. 06:02)", name: "videoDuration", widget: "string", required: false}
      - {label: "Featured (top story on the homepage)", name: "isFeatured", widget: "boolean", default: false}
      - {label: "Homepage Promo Banner", name: "isBanner", widget: "boolean", default: false}
      - {label: "Status (Draft = hidden from the website)", name: "status", widget: "select", options: [{label: "Published", value: "published"}, {label: "Draft", value: "draft"}], default: "published"}
      - {label: "Author name (optional)", name: "author", widget: "string", required: false}
      - {label: "Author role (optional, e.g. Club Media Officer)", name: "authorRole", widget: "string", required: false}
      - {label: "Author photo (optional)", name: "authorPhoto", widget: "image", required: false}
      - {label: "Updated at (set this when you edit a published story)", name: "updatedAt", widget: "datetime", required: false}
      - {label: "Tagged players", name: "players", widget: "relation", collection: "players", value_field: "{{slug}}", search_fields: ["name"], display_fields: ["name"], multiple: true, required: false, hint: "Shown as player chips; the story also appears on each player's profile."}
      - {label: "Series (optional, e.g. Heritage)", name: "series", widget: "string", required: false, hint: "Use Heritage for long reads about club history and legends."}
      - {label: "Matchday content type", name: "contentType", widget: "select", required: false, options: ["General", "Preview", "Team News", "Line-ups", "Live updates", "Match Report", "Highlights", "Reaction/Interview"], hint: "Used by the matchday content checklist in Admin → Match Centre."}
      - {label: "Match date (for match previews, team news, reports…)", name: "matchDate", widget: "datetime", required: false, time_format: false, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY"}
      - label: "Team News table (Team News stories only)"
        name: "teamNews"
        widget: "list"
        required: false
        summary: "{{fields.name}}{{fields.player}} – {{fields.status}}"
        fields:
          - {label: "Player", name: "player", widget: "relation", collection: "players", value_field: "{{slug}}", search_fields: ["name"], display_fields: ["name"], required: false}
          - {label: "…or type a name", name: "name", widget: "string", required: false}
          - {label: "Status", name: "status", widget: "select", options: ["Available", "Doubtful", "Injured", "Suspended"], default: "Available"}
          - {label: "Injury or reason", name: "reason", widget: "string", required: false}
          - {label: "Expected return", name: "expectedReturn", widget: "string", required: false}
      - label: "Photo gallery (long reads)"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - {label: "Photo", name: "src", widget: "image"}
          - {label: "Caption", name: "caption", widget: "string", required: false}
      - {label: "Body (use > at the start of a line for a pull quote)", name: "body", widget: "markdown"}

  - name: "players"
    label: "Squad / Players"
    folder: "src/content/players"
    create: true
    # The file name becomes the profile URL: /squad/<file-name>
    slug: "{{slug}}"
    fields:
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Position", name: "position", widget: "select", options: [{label: "Goalkeeper", value: "GK"}, {label: "Defender", value: "DEF"}, {label: "Midfielder", value: "MID"}, {label: "Forward", value: "FWD"}]}
      - {label: "Shirt Number", name: "number", widget: "number", value_type: "int"}
      - {label: "Photo", name: "photo", widget: "image", required: false}
      - {label: "Date of Birth", name: "dateOfBirth", widget: "datetime", type: "date", time_format: false, required: false}
      - {label: "State of Origin", name: "stateOfOrigin", widget: "string", required: false}
      - {label: "Nationality", name: "nationality", widget: "string", default: "Nigeria"}
      - {label: "Height (e.g. 1.85 m)", name: "height", widget: "string", required: false}
      - {label: "Preferred Foot", name: "preferredFoot", widget: "select", options: ["Left", "Right", "Both"], required: false}
      - {label: "Appearances", name: "apps", widget: "number", value_type: "int", default: 0}
      - {label: "Goals", name: "goals", widget: "number", value_type: "int", default: 0}
      - {label: "Assists", name: "assists", widget: "number", value_type: "int", default: 0}
      - {label: "Clean Sheets (goalkeepers)", name: "cleanSheets", widget: "number", value_type: "int", default: 0}
      - {label: "Sample player (shows a SAMPLE label; untick for real players)", name: "isSample", widget: "boolean", default: false}
      - {label: "Short Bio", name: "body", widget: "markdown", required: false}

  - name: "gallery"
    label: "Gallery Photos"
    folder: "src/content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Caption", name: "caption", widget: "string"}
      - {label: "Photo", name: "photo", widget: "image"}

  - name: "fixtures"
    label: "Fixtures & Results"
    folder: "src/content/fixtures"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Home Team", name: "home", widget: "string"}
      - {label: "Away Team", name: "away", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Venue", name: "venue", widget: "string"}
      - {label: "Competition", name: "competition", widget: "string", default: "NPFL"}
      - {label: "Home Score", name: "home_score", widget: "number", required: false}
      - {label: "Away Score", name: "away_score", widget: "number", required: false}
      - {label: "Status", name: "status", widget: "select", options: ["Upcoming", "Completed"]}

  - name: "staff"
    label: "Coaching Staff"
    folder: "src/content/staff"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Role", name: "role", widget: "string"}
      - {label: "Initials (shown if no photo)", name: "initials", widget: "string"}
      - {label: "Photo", name: "photo", widget: "image", required: false}
      - {label: "Display Order", name: "order", widget: "number", default: 10}
      - {label: "Group", name: "group", widget: "select", options: ["Management", "Coaching Staff"], default: "Management"}
      - {label: "Short Bio", name: "bio", widget: "text"}

  - name: "heroSlides"
    label: "Homepage Hero Slides"
    folder: "src/content/hero-slides"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Photo", name: "photo", widget: "image"}
      - {label: "Display Order", name: "order", widget: "number", default: 10}

  - name: "partners"
    label: "Partners"
    folder: "src/content/partners"
    create: true
    # The file name becomes the partner page: /partners/<file-name>
    slug: "{{slug}}"
    sortable_fields: ["tier", "displayOrder", "name"]
    summary: "{{name}} - {{officialTitle}}"
    fields:
      - {label: "Partner Name", name: "name", widget: "string"}
      - {label: "Tier", name: "tier", widget: "select", options: ["Principal Partner", "Official Kit Partner", "Official Club Partners", "Official Suppliers", "Media & Broadcast Partners", "Institutional & Community Partners"]}
      - {label: "Category (e.g. Banking, Telecom). Only one active Official Club Partner per category.", name: "category", widget: "string"}
      - {label: "Official Title (e.g. Official Banking Partner)", name: "officialTitle", widget: "string"}
      - {label: "Logo (transparent PNG or SVG is best)", name: "logo", widget: "image", required: false}
      - {label: "Logo for dark backgrounds (optional)", name: "logoDark", widget: "image", required: false}
      - {label: "Card colour behind the logo (only for logos on a dark background, e.g. #000000)", name: "cardColor", widget: "string", required: false}
      - {label: "Website (full link, starting https://)", name: "website", widget: "string", required: false}
      - {label: "Short Description (one sentence)", name: "shortDescription", widget: "text", required: false}
      - {label: "Partner Since (year)", name: "since", widget: "number", value_type: "int", required: false}
      - {label: "Display Order (1 shows first within its tier)", name: "displayOrder", widget: "number", value_type: "int", default: 10}
      - {label: "Active (shown on the site)", name: "active", widget: "boolean", default: true}
      - {label: "Age restricted (alcohol brand - shows 18+ | Drink Responsibly)", name: "ageRestricted", widget: "boolean", default: false}
      - {label: "Longer description (partner page)", name: "body", widget: "markdown", required: false}

  # Single data files (src/data/*.json) -- one entry each, edited in place.
  - name: "settings"
    label: "Site Settings, League Table & Shop"
    files:
      - name: "promo"
        label: "Promo Bar (thin bar at the top of every page)"
        file: "src/data/promo.json"
        fields:
          - {label: "Show the promo bar", name: "enabled", widget: "boolean", default: false}
          - {label: "Text (keep it short)", name: "text", widget: "string", hint: "e.g. Tickets on sale: Lobi Stars vs Kada Warriors"}
          - {label: "Link text (optional)", name: "linkText", widget: "string", required: false, hint: "e.g. Buy now"}
          - {label: "Link address (optional)", name: "url", widget: "string", required: false, hint: "e.g. /tickets/ or a full https:// address"}
          - {label: "Show from (optional, Nigerian time)", name: "start", widget: "datetime", required: false, format: "YYYY-MM-DDTHH:mm", date_format: "DD/MM/YYYY", time_format: "HH:mm"}
          - {label: "Show until (optional, Nigerian time)", name: "end", widget: "datetime", required: false, format: "YYYY-MM-DDTHH:mm", date_format: "DD/MM/YYYY", time_format: "HH:mm"}
      - name: "site"
        label: "Season, Homepage Stats & Footer Text"
        file: "src/data/site.json"
        fields:
          - {label: "Current Season (e.g. 2026/27)", name: "currentSeason", widget: "string"}
          - {label: "Footer Tagline", name: "footerTagline", widget: "text"}
          - label: "Social links (leave blank to hide an icon)"
            name: "social"
            widget: "object"
            fields:
              - {label: "Facebook", name: "facebook", widget: "string", required: false}
              - {label: "X (Twitter)", name: "x", widget: "string", required: false}
              - {label: "Instagram", name: "instagram", widget: "string", required: false}
              - {label: "YouTube", name: "youtube", widget: "string", required: false}
              - {label: "TikTok", name: "tiktok", widget: "string", required: false}
              - {label: "WhatsApp Channel (shows the 'Join our WhatsApp Channel' blocks)", name: "whatsappChannel", widget: "string", required: false}
          - label: "Homepage Stats Bar"
            name: "stats"
            widget: "list"
            fields:
              - {label: "Value (e.g. 1969)", name: "value", widget: "string"}
              - {label: "Label (e.g. Year Founded)", name: "label", widget: "string"}

      - name: "leagueTable"
        label: "League Table"
        file: "src/data/league-table.json"
        fields:
          - {label: "Competition", name: "competition", widget: "string"}
          - {label: "Last Updated (YYYY-MM-DD)", name: "lastUpdated", widget: "string", required: false}
          - label: "Clubs"
            name: "rows"
            widget: "list"
            summary: "{{fields.club}}"
            fields:
              - {label: "Club", name: "club", widget: "string"}
              - {label: "Crest", name: "crest", widget: "image", required: false}
              - {label: "Played", name: "played", widget: "number", value_type: "int", default: 0}
              - {label: "Won", name: "won", widget: "number", value_type: "int", default: 0}
              - {label: "Drawn", name: "drawn", widget: "number", value_type: "int", default: 0}
              - {label: "Lost", name: "lost", widget: "number", value_type: "int", default: 0}
              - {label: "Goals For", name: "goalsFor", widget: "number", value_type: "int", default: 0}
              - {label: "Goals Against", name: "goalsAgainst", widget: "number", value_type: "int", default: 0}
              - {label: "Points Adjustment (e.g. -3 for a deduction)", name: "pointsAdjustment", widget: "number", value_type: "int", default: 0}

      - name: "shop"
        label: "Club Shop Products"
        file: "src/data/shop.json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "ID (no spaces)", name: "id", widget: "string"}
              - {label: "Name ({season} is replaced with the current season)", name: "name", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Price in Naira (leave empty if not known yet)", name: "price", widget: "number", value_type: "int", required: false}
              - {label: "Photo", name: "image", widget: "image"}
              - {label: "Jumia Product Link", name: "jumiaUrl", widget: "string", required: false}
              - {label: "Badge (e.g. NEW)", name: "badge", widget: "string", required: false}
              - {label: "Badge Colour", name: "badgeColor", widget: "string", default: "#E31E24"}
              - {label: "In Stock", name: "inStock", widget: "boolean", default: true}

      - name: "videos"
        label: "Video Library (YouTube)"
        file: "src/data/videos.json"
        fields:
          - label: "Videos"
            name: "videos"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "YouTube ID (11 characters after watch?v=)", name: "id", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Category", name: "category", widget: "select", options: ["Highlights", "Goals", "Interviews", "Press Conferences", "Behind the Scenes"]}
              - {label: "Duration (e.g. 06:02)", name: "duration", widget: "string", required: false}
              - {label: "Date (YYYY-MM-DD)", name: "date", widget: "string", required: false}

      - name: "history"
        label: "Club History Timeline"
        file: "src/data/history.json"
        fields:
          - {label: "Introduction", name: "intro", widget: "text", required: false}
          - label: "Timeline"
            name: "events"
            widget: "list"
            summary: "{{fields.year}} - {{fields.title}}"
            fields:
              - {label: "Year", name: "year", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Verified (show on the site)", name: "verified", widget: "boolean", default: false}

      - name: "honours"
        label: "Honours / Trophy Cabinet"
        file: "src/data/honours.json"
        fields:
          - label: "Honours"
            name: "honours"
            widget: "list"
            summary: "{{fields.competition}}"
            fields:
              - {label: "Competition", name: "competition", widget: "string"}
              - {label: "Winning seasons / years", name: "years", widget: "list"}
              - {label: "Verified (show on the site)", name: "verified", widget: "boolean", default: false}

      - name: "stadium"
        label: "Stadium Information"
        file: "src/data/stadium.json"
        fields:
          - {label: "Stadium Name", name: "name", widget: "string"}
          - {label: "Address", name: "address", widget: "string"}
          - {label: "Capacity", name: "capacity", widget: "string", required: false}
          - {label: "Opened", name: "opened", widget: "string", required: false}
          - {label: "About the stadium", name: "about", widget: "text", required: false}
          - {label: "How to get there", name: "directions", widget: "list", required: false}
          - {label: "Matchday tips", name: "tips", widget: "list", required: false}

      - name: "fanClubs"
        label: "Supporters Clubs"
        file: "src/data/fan-clubs.json"
        fields:
          - label: "Clubs"
            name: "clubs"
            widget: "list"
            summary: "{{fields.city}} - {{fields.name}}"
            fields:
              - {label: "City", name: "city", widget: "string"}
              - {label: "Club Name", name: "name", widget: "string"}
              - {label: "Contact Person", name: "contact", widget: "string"}
              - {label: "Phone", name: "phone", widget: "string", required: false}
              - {label: "Social Link", name: "social", widget: "string", required: false}

      - name: "partnership"
        label: "Partnership Opportunities & Benefits"
        file: "src/data/partnership.json"
        fields:
          - {label: "Intro line (partners page banner)", name: "intro", widget: "text"}
          - {label: "Open Official Club Partner categories (filled ones are hidden automatically)", name: "openCategories", widget: "list"}
          - label: "Why partner with Lobi Stars"
            name: "benefits"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Figure (e.g. 15,000) - leave empty to hide", name: "figure", widget: "string", required: false}
              - {label: "Figure label (e.g. matchday fans)", name: "figureLabel", widget: "string", required: false}
          - {label: "Partnership brochure PDF (leave empty to hide the button)", name: "brochureUrl", widget: "file", required: false}
